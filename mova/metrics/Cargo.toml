[package]
name = "lsp-metrics"
version = "0.1.0"
edition = "2021"
description = "Out-of-process metrics for clojure-lsp on Mova: LSP wire tap + process sampler"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
